<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="{{ '/' | relative_url }}">AI <span>for</span> Science</a>
      <nav>
        <a href="{{ '/' | relative_url }}#about"{% if page.nav == 'home' %} aria-current="page"{% endif %}>Overview</a>
        <a href="{{ '/' | relative_url }}#slides">Slides</a>
        <a href="{{ '/' | relative_url }}#readings">Readings</a>
        <a href="{{ '/lab/' | relative_url }}"{% if page.nav == 'lab' %} aria-current="page"{% endif %}>Lab</a>
      </nav>
    </div>
  </header>

  <main class="wrap {% if page.nav == 'lab' %}prose lab{% endif %}">
    {% if page.nav == 'lab' %}<p class="eyebrow">In-class exercise</p><h1>{{ page.title }}</h1>{% endif %}
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap">Tech Labs 2026 · AI for Science · Dan Turner-Evans</div>
  </footer>
</body>
</html>
